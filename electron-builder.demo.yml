appId: com.vladlen.retailpricemonitor.demo
productName: Price Monitor Demo
artifactName: Price Monitor Demo Setup ${version}.${ext}
asar: true
directories:
  output: release-demo
files:
  - main.js
  - preload.js
  - scraper.js
  - batch.js
  - saved-lists.js
  - search-history.js
  - comparison.js
  - comparison-store.js
  - archive-store.js
  - archive-tools.js
  - price-history-export.js
  - multi-store-export.js
  - change-report.js
  - result-view.js
  - demo-access.js
  - license-access.js
  - device-identity.js
  - license-public.pem
  - renderer.js
  - index.html
  - styles.css
  - package.json
extraMetadata:
  # Keep the package identity separate from the full edition.  NSIS uses
  # package name for the default one-click install directory.
  name: retail-price-monitor-demo
  productName: Price Monitor Demo
  priceMonitorEdition: demo
npmRebuild: false
win:
  forceCodeSigning: false
  target:
    - nsis
nsis:
  # An assisted installer makes the target directory visible and prevents a
  # demo build from silently replacing the full edition.
  oneClick: false
  allowToChangeInstallationDirectory: true
  runAfterFinish: false
publish: null
