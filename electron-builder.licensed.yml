appId: com.vladlen.retailpricemonitor.licensed
productName: Price Monitor Licensed
artifactName: Price Monitor Licensed Setup ${version}.${ext}
asar: true
directories:
  output: release-licensed
files:
  - main.js
  - preload.js
  - scraper.js
  - batch.js
  - saved-lists.js
  - search-history.js
  - comparison.js
  - comparison-store.js
  - archive-store.js
  - archive-tools.js
  - price-history-export.js
  - multi-store-export.js
  - change-report.js
  - result-view.js
  - demo-access.js
  - license-access.js
  - device-identity.js
  - license-public.pem
  - renderer.js
  - index.html
  - styles.css
  - package.json
extraMetadata:
  name: retail-price-monitor-licensed
  productName: Price Monitor Licensed
  priceMonitorEdition: licensed
  priceMonitorBundledLicense: false
  priceMonitorLicenseServerUrl: ""
npmRebuild: false
win:
  forceCodeSigning: false
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  runAfterFinish: false
publish: null
