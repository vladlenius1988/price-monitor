appId: com.vladlen.retailpricemonitor.cloudtest
productName: Price Monitor Cloud Test
artifactName: Price Monitor Cloud Test Setup ${version}.${ext}
asar: true
directories:
  output: release-cloud-client
files:
  - main.js
  - preload.js
  - scraper.js
  - batch.js
  - saved-lists.js
  - search-history.js
  - comparison.js
  - comparison-store.js
  - archive-store.js
  - archive-tools.js
  - price-history-export.js
  - multi-store-export.js
  - change-report.js
  - result-view.js
  - demo-access.js
  - license-access.js
  - device-identity.js
  - license-public.pem
  - renderer.js
  - index.html
  - styles.css
  - package.json
extraMetadata:
  name: retail-price-monitor-cloud-test
  productName: Price Monitor Cloud Test
  priceMonitorEdition: licensed
  priceMonitorBundledLicense: false
  priceMonitorLicenseServerUrl: https://price-monitor-license-staging.vladlenius.workers.dev
  priceMonitorLiveLicenseIntervalMs: 5000
  priceMonitorAppName: Price Monitor Cloud Test
  priceMonitorWindowTitle: Price Monitor — хмарний тест
  priceMonitorAppId: com.vladlen.retailpricemonitor.cloudtest
  priceMonitorUserDataName: Price Monitor Cloud Test
npmRebuild: false
win:
  forceCodeSigning: false
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  runAfterFinish: false
publish: null
